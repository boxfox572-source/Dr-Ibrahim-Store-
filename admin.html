<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,sans-serif;background:#f3f4f6;color:#26364a;padding:14px;max-width:760px;margin:auto}
h1{font-size:22px;margin:8px 0 14px}h3{margin:16px 0 8px}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:15px}
label{font-size:14px;color:#555}
button{font-family:inherit;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:15px;background:#26364a;color:#fff}
button.r{background:#dc3232}button.g{background:#888}button.ok{background:#1a9e55}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#fff;color:#26364a;border:1px solid #ddd}.tabs button.on{background:#26364a;color:#fff}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.row img{width:54px;height:54px;object-fit:contain;background:#f3f3f3;border-radius:6px}
.row .t{flex:1;font-size:14px}.row .a{display:flex;gap:6px;flex-wrap:wrap}.row .a button{padding:6px 10px;font-size:13px}
.hid{opacity:.5}
.ban{position:relative;display:inline-block;margin:4px}.ban img{height:80px;border-radius:8px}.ban button{position:absolute;top:2px;left:2px;padding:2px 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="login" class="box" style="margin-top:60px">
  <h1>دخول الأدمن</h1>
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username">
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password">
  <button onclick="doLogin()" style="width:100%;margin-top:8px">دخول</button>
  <p id="err" style="color:#dc3232;margin-top:8px"></p>
</div>

<div id="app" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center"><h1>لوحة التحكم</h1><button class="g" onclick="auth.signOut()">خروج</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== الصق نفس إعدادات Firebase هنا =====
const firebaseConfig = {
  apiKey: "PASTE_HERE", authDomain: "PASTE_HERE", projectId: "PASTE_HERE", appId: "PASTE_HERE"
};
// =========================================
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = 'products', P = [], O = [], S = {categories: [], banners: []}, editing = null, unsub = [];

async function doLogin() {
  try { await auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value); }
  catch { $('err').textContent = 'الإيميل أو الباسورد غلط'; }
}
auth.onAuthStateChanged(u => {
  unsub.forEach(f => f()); unsub = [];
  $('login').style.display = u ? 'none' : ''; $('app').style.display = u ? '' : 'none';
  if (!u) return;
  unsub.push(db.collection('products').orderBy('createdAt', 'desc').onSnapshot(s => { P = s.docs.map(d => ({id: d.id, ...d.data()})); draw(); }));
  unsub.push(db.collection('orders').orderBy('createdAt', 'desc').onSnapshot(s => { O = s.docs.map(d => ({id: d.id, ...d.data()})); draw(); }));
  unsub.push(db.doc('settings/main').onSnapshot(d => { if (d.exists) S = {categories: [], banners: [], ...d.data()}; draw(); }));
});

// ضغط الصورة قبل الحفظ (تتخزن داخل قاعدة البيانات بدون تكلفة)
function pic(file, max = 700, qual = .75) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', qual)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}
function draw() {
  const T = {products: 'المنتجات', settings: 'الإعدادات', banners: 'البانرات', orders: `الطلبات (${O.length})`};
  $('tabs').innerHTML = Object.keys(T).map(k => `<button class="${tab === k ? 'on' : ''}" onclick="tab='${k}';editing=null;draw()">${T[k]}</button>`).join('');
  if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) && editing === null && tab === 'settings') return;
  $('pane').innerHTML = {products: pProducts, settings: pSettings, banners: pBanners, orders: pOrders}[tab]();
}
function pProducts() {
  const e = editing === 'new' ? {} : P.find(x => x.id === editing) || null;
  const cats = S.categories || [];
  let h = '';
  if (e) h += `<div class="box"><h3>${e.id ? 'تعديل منتج' : 'منتج جديد'}</h3>
   <label>الاسم</label><input id="fn" value="${esc(e.name)}">
   <div class="two"><div><label>السعر</label><input id="fp" type="number" value="${e.price ?? ''}"></div><div><label>السعر قبل الخصم (اختياري)</label><input id="fo" type="number" value="${e.oldPrice ?? ''}"></div></div>
   <div class="two"><div><label>القسم</label><select id="fc"><option value="">بدون</option>${cats.map(c => `<option ${e.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div><div><label>البراند</label><input id="fb" value="${esc(e.brand)}"></div></div>
   <label>الصورة</label><input id="fi" type="file" accept="image/*">${e.img ? `<img src="${e.img}" style="height:70px;margin:6px 0">` : ''}
   <label><input id="fh" type="checkbox" style="width:auto" ${e.hidden ? 'checked' : ''}> مخفي عن العملاء</label>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="ok" onclick="saveP('${e.id || ''}')">حفظ</button><button class="g" onclick="editing=null;draw()">إلغاء</button></div></div>`;
  else h += `<button class="ok" onclick="editing='new';draw()" style="width:100%;margin-bottom:12px">+ إضافة منتج</button>`;
  h += `<div class="box">` + (P.length ? P.map(p => `<div class="row ${p.hidden ? 'hid' : ''}"><img src="${p.img || ''}" alt=""><div class="t">${esc(p.name)}<br><b>${p.price}</b> ${p.oldPrice ? `<s>${p.oldPrice}</s>` : ''} ${p.hidden ? '(مخفي)' : ''}</div>
    <div class="a"><button onclick="editing='${p.id}';draw();scrollTo(0,0)">تعديل</button><button class="g" onclick="tog('${p.id}',${!p.hidden})">${p.hidden ? 'إظهار' : 'إخفاء'}</button><button class="r" onclick="delP('${p.id}')">حذف</button></div></div>`).join('') : 'لا توجد منتجات بعد') + `</div>`;
  return h;
}
async function saveP(id) {
  const name = $('fn').value.trim(), price = +$('fp').value;
  if (!name || !price) return alert('الاسم والسعر مطلوبين');
  const d = {name, price, oldPrice: +$('fo').value || 0, cat: $('fc').value, brand: $('fb').value.trim(), hidden: $('fh').checked};
  const f = $('fi').files[0]; if (f) d.img = await pic(f);
  if (id) await db.collection('products').doc(id).update(d);
  else await db.collection('products').add({...d, img: d.img || '', createdAt: Date.now()});
  editing = null; draw();
}
const tog = (id, h) => db.collection('products').doc(id).update({hidden: h});
const delP = id => confirm('حذف المنتج نهائيًا؟') && db.collection('products').doc(id).delete();

function pSettings() {
  return `<div class="box"><label>اسم المتجر</label><input id="sn" value="${esc(S.storeName || 'Dr.Ibrahim Store')}">
  <label>الشريط العلوي (عرض/إعلان)</label><input id="sa" value="${esc(S.announce)}">
  <label>رقم الواتس لاستقبال الطلبات (بالكود الدولي، مثال 201012345678)</label><input id="sw" dir="ltr" value="${esc(S.whatsapp)}">
  <label>رقم التواصل (يظهر في الفوتر)</label><input id="sp" dir="ltr" value="${esc(S.phone)}">
  <label>العنوان</label><textarea id="sd" rows="2">${esc(S.address)}</textarea>
  <label>الأقسام (افصل بينها بفاصلة ,)</label><input id="sc" value="${esc((S.categories || []).join(','))}">
  <label>رابط فيسبوك</label><input id="s1" dir="ltr" value="${esc(S.fb)}"><label>رابط انستجرام</label><input id="s2" dir="ltr" value="${esc(S.ig)}"><label>رابط تيك توك</label><input id="s3" dir="ltr" value="${esc(S.tt)}">
  <button class="ok" onclick="saveS()" style="margin-top:10px;width:100%">حفظ الإعدادات</button></div>`;
}
async function saveS() {
  await db.doc('settings/main').set({storeName: $('sn').value.trim(), announce: $('sa').value.trim(), whatsapp: $('sw').value.replace(/\D/g, ''), phone: $('sp').value.trim(),
    address: $('sd').value.trim(), categories: $('sc').value.split(/[,،]/).map(x => x.trim()).filter(Boolean), fb: $('s1').value.trim(), ig: $('s2').value.trim(), tt: $('s3').value.trim()}, {merge: true});
  alert('تم الحفظ');
}
function pBanners() {
  return `<div class="box"><label>أضف صور بانر (مقاس عرضي 16:9 يفضل)</label><input type="file" accept="image/*" multiple onchange="addB(this.files)">
  <div style="margin-top:10px">${(S.banners || []).map((b, i) => `<span class="ban"><img src="${b}" alt=""><button class="r" onclick="delB(${i})">×</button></span>`).join('') || 'لا توجد بانرات'}</div></div>`;
}
async function addB(files) {
  const n = [...(S.banners || [])]; for (const f of files) n.push(await pic(f, 1200, .7));
  await db.doc('settings/main').set({banners: n}, {merge: true});
}
const delB = i => db.doc('settings/main').set({banners: S.banners.filter((_, j) => j !== i)}, {merge: true});

function pOrders() {
  return `<div class="box">` + (O.length ? O.map(o => `<div class="row"><div class="t"><b>${esc(o.name)}</b> — <span dir="ltr">${esc(o.phone)}</span><br>${esc(o.address)}<br>الإجمالي: <b>${o.total}</b> — ${new Date(o.createdAt).toLocaleString('ar-EG')}<br>الحالة: ${esc(o.status)}</div>
   <div class="a"><button class="ok" onclick="st('${o.id}','تم التوصيل')">تم التوصيل</button><button class="r" onclick="delO('${o.id}')">حذف</button></div></div>`).join('') : 'لا توجد طلبات') + `</div>`;
}
const st = (id, s) => db.collection('orders').doc(id).update({status: s});
const delO = id => confirm('حذف الطلب؟') && db.collection('orders').doc(id).delete();
</script>
</body>
</html>
